<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 490.65" role="img" aria-label="The final minute of a quarter: the clock marks the study uses, one real 2-for-1, and how the team with the ball is sorted"><title>The final minute of a quarter: the clock marks the study uses, one real 2-for-1, and how the team with the ball is sorted</title><defs><marker id="dg-arrow-a2c2cbb891" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="20" class="dg-f-ink dg-display" font-weight="600">1. The marks on the clock</text><text x="12" y="46" font-size="14" class="dg-f-ink2 dg-text">Seconds left in quarters one to three, from 60 down to the buzzer</text><text x="12" y="76" font-size="15" class="dg-f-ink dg-text" font-weight="700">One real 2-for-1: CLE at IND, Q3, 2023-24</text><text x="36" y="127" font-size="14" class="dg-f-ink3 dg-text">window opens, 60 s</text><text x="260" y="104" font-size="14" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">decision mark, 40 s</text><text x="360.8" y="127" font-size="14" class="dg-f-nba dg-text" font-weight="700">2-for-1 threshold, 32 s</text><text x="724" y="104" font-size="14" class="dg-f-ink3 dg-text" text-anchor="end">buzzer, 0 s</text><line x1="32" y1="133" x2="32" y2="141" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><line x1="32" y1="175" x2="32" y2="181" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><line x1="264" y1="110" x2="264" y2="141" stroke-width="1.5" class="dg-s-ink" stroke-dasharray="4 3"/><line x1="264" y1="175" x2="264" y2="181" stroke-width="1.5" class="dg-s-ink" stroke-dasharray="4 3"/><line x1="356.8" y1="133" x2="356.8" y2="141" stroke-width="1.5" class="dg-s-nba" stroke-dasharray="4 3"/><line x1="356.8" y1="175" x2="356.8" y2="181" stroke-width="1.5" class="dg-s-nba" stroke-dasharray="4 3"/><line x1="728" y1="110" x2="728" y2="141" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><line x1="728" y1="175" x2="728" y2="181" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><rect x="32" y="141" width="127.6" height="34" class="dg-f-ink3" rx="3" opacity="0.45"/><line x1="32" y1="141" x2="32" y2="175" stroke-width="2" class="dg-s-surface"/><text x="95.8" y="163.44" font-size="14" class="dg-f-ink dg-text" text-anchor="middle" font-weight="600">CLE 2 pts</text><rect x="159.6" y="141" width="185.6" height="34" class="dg-f-nba" rx="3" opacity="0.9"/><line x1="159.6" y1="141" x2="159.6" y2="175" stroke-width="2" class="dg-s-surface"/><text x="252.4" y="163.44" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="600">IND 2 pts</text><rect x="345.2" y="141" width="116" height="34" class="dg-f-ink3" rx="3" opacity="0.45"/><line x1="345.2" y1="141" x2="345.2" y2="175" stroke-width="2" class="dg-s-surface"/><text x="403.2" y="163.44" font-size="14" class="dg-f-ink dg-text" text-anchor="middle" font-weight="600">CLE turnover</text><rect x="461.2" y="141" width="266.8" height="34" class="dg-f-nba" rx="3" opacity="0.9"/><line x1="461.2" y1="141" x2="461.2" y2="175" stroke-width="2" class="dg-s-surface"/><text x="594.6" y="163.44" font-size="14" class="dg-f-surface dg-text" text-anchor="middle" font-weight="600">IND miss</text><line x1="32" y1="181" x2="728" y2="181" stroke-width="1" class="dg-s-rule"/><text x="12" y="207" font-size="15" class="dg-f-ink2 dg-text">IND had the ball at the decision mark and shot with 33 seconds left, so it got the ball</text><text x="12" y="227.25" font-size="15" class="dg-f-ink2 dg-text">back: two IND possessions to CLE&#x27;s one.</text><text x="12" y="271.25" font-size="20" class="dg-f-ink dg-display" font-weight="600">2. Sorting the team with the ball at the mark</text><text x="12" y="289.25" font-size="14" class="dg-f-ink2 dg-text">by when its possession ends</text><rect x="264" y="307.25" width="139.2" height="30" class="d