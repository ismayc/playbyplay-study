<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 599" role="img" aria-label="From the own-points headline to the fair net comparison"><title>From the own-points headline to the fair net comparison</title><defs><marker id="dg-arrow-79e1557fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="22" font-size="12" class="dg-f-ink2 dg-text">Points per team-period gained by shooting early,</text><text x="12" y="38.2" font-size="12" class="dg-f-ink2 dg-text">with 95% intervals</text><text x="12" y="64.2" font-size="13" class="dg-f-ink dg-text" font-weight="700">Own points, every team-period</text><text x="12" y="81.75" font-size="12" class="dg-f-ink2 dg-text">NBA 2023-24</text><line x1="250.175" y1="117.75" x2="316.296" y2="117.75" stroke-width="3" class="dg-s-nba"/><line x1="250.175" y1="110.75" x2="250.175" y2="124.75" stroke-width="2" class="dg-s-nba"/><line x1="316.296" y1="110.75" x2="316.296" y2="124.75" stroke-width="2" class="dg-s-nba"/><circle cx="283.183" cy="117.75" r="6" class="dg-f-nba"/><text x="283.183" y="104.75" font-size="12" class="dg-f-ink dg-text" text-anchor="middle">+0.78 [+0.68, +0.88]</text><text x="38" y="163.75" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">Keep only team-periods whose first shot came</text><text x="38" y="179.95" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">20 to 45 seconds out, so both groups had the</text><text x="38" y="196.15" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">ball at similar times</text><line x1="22" y1="149.75" x2="22" y2="206.15" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-79e1557fd8)"/><text x="12" y="226.15" font-size="13" class="dg-f-ink dg-text" font-weight="700">Own points, comparable team-periods</text><text x="12" y="243.7" font-size="12" class="dg-f-ink2 dg-text">NBA 2023-24</text><line x1="141.387" y1="279.7" x2="235.068" y2="279.7" stroke-width="3" class="dg-s-nba"/><line x1="141.387" y1="272.7" x2="141.387" y2="286.7" stroke-width="2" class="dg-s-nba"/><line x1="235.068" y1="272.7" x2="235.068" y2="286.7" stroke-width="2" class="dg-s-nba"/><circle cx="187.353" cy="279.7" r="6" class="dg-f-nba"/><text x="187.353" y="266.7" font-size="12" class="dg-f-ink dg-text" text-anchor="middle">+0.49 [+0.36, +0.64]</text><text x="38" y="325.7" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">Subtract what the opponent scored in the same</text><text x="38" y="341.9" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">window</text><line x1="22" y1="311.7" x2="22" y2="351.9" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-79e1557fd8)"/><text x="12" y="371.9" font-size="13" class="dg-f-ink dg-text" font-weight="700">Net points, comparable team-periods</text><text x="12" y="389.45" font-size="12" class="dg-f-ink2 dg-text">NBA 2023-24</text><line x1="29.8708" y1="425.45" x2="169.068" y2="425.45" stroke-width="3" class="dg-s-nba"/><line x1="29.8708" y1="418.45" x2="29.8708" y2="432.45" stroke-width="2" class="dg-s-nba"/><line x1="169.068" y1="418.45" x2="169.068" y2="432.45" stroke-width="2" class="dg-s-nba"/><circle cx="99.5964" cy="425.45" r="6" class="dg-f-nba"/><text x="99.5964" y="412.45" font-size="12" class="dg-f-ink dg-text" text-anchor="middle">+0.24 [+0.03, +0.44]</text><text x="38" y="471.45" font-size="12" class="dg-f-ink3 dg-text" font-style="italic">Pool three NBA seasons</text><line x1="22" y1="457.45" x2="22" y2="481.45" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-79e1557fd8)"/><text x="12" y="501.45" font-size="13" class="dg-f-ink dg-text" font-weight="700">Net points, comparable team-periods</text><text x="12" y="519" font-size="12" class="dg-f-ink2 dg-text">NBA 2023-24 to 2025-26</text><line x1="53.7896" y1="555" x2="136.245" y2="555" stroke-width="3" class="dg-s-nba"/><line x1="53.7896" y1="548" x2="53.7896" y2="562" stroke-width="2" class="dg-s-nba"/><line x1="136.245" y1="548" x2="136.245" y2="562" stroke-width="2" class="dg-s-nba"/><circle cx="95.2812" cy="555" r="7" class="dg-f-nba"/><text x="95.2812" y="542" font-size="12" class="dg-f-ink dg-text" text-anchor="middle" font-weight="700">+0.22 [+0.10, +0.34]</text><line x1="20" y1="107.75" x2="20" y2="127.75" stroke-width="1" class="dg-s-ink2" stroke-dasharray="3 3"/><line x1="20" y1="269.7" x2="20" y2="289.7" stroke-width="1" class="dg-s-ink2" stroke-dasharray="3 3"/><line x1="20" y1="415.45" x2="20" y2="435.45" stroke-width="1" class="dg-s-ink2" stroke-dasharray="3 3"/><line x1="20" y1="545" x2="20" y2="565" stroke-width="1" class="dg-s-ink2" stroke-dasharray="3 3"/><text x="20" y="587" font-size="12" class="dg-f-ink2 dg-text">dashed: 0, no edge</text></svg>
