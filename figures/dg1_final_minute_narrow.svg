<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 596.65" role="img" aria-label="The final minute of a quarter: the clock marks the study uses, one real 2-for-1, and how the team with the ball is sorted"><title>The final minute of a quarter: the clock marks the study uses, one real 2-for-1, and how the team with the ball is sorted</title><defs><marker id="dg-arrow-9388e9d054" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="28" font-size="17" class="dg-f-ink dg-display" font-weight="600">1. The marks on the clock</text><text x="12" y="46" font-size="12" class="dg-f-ink2 dg-text">Seconds left in quarters one to three, from 60</text><text x="12" y="62.2" font-size="12" class="dg-f-ink2 dg-text">down to the buzzer</text><text x="12" y="92.2" font-size="13" class="dg-f-ink dg-text" font-weight="700">One real 2-for-1: CLE at IND, Q3, 2023-24</text><text x="22" y="140.2" font-size="12" class="dg-f-ink3 dg-text">opens, 60 s</text><text x="122" y="120.2" font-size="12" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">decision, 40 s</text><text x="173.2" y="140.2" font-size="12" class="dg-f-nba dg-text" font-weight="700">threshold, 32 s</text><text x="338" y="120.2" font-size="12" class="dg-f-ink3 dg-text" text-anchor="end">buzzer, 0 s</text><line x1="18" y1="146.2" x2="18" y2="154.2" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><line x1="18" y1="233.4" x2="18" y2="237.4" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><line x1="126" y1="126.2" x2="126" y2="154.2" stroke-width="1.5" class="dg-s-ink" stroke-dasharray="4 3"/><line x1="126" y1="233.4" x2="126" y2="237.4" stroke-width="1.5" class="dg-s-ink" stroke-dasharray="4 3"/><line x1="169.2" y1="146.2" x2="169.2" y2="154.2" stroke-width="1.5" class="dg-s-nba" stroke-dasharray="4 3"/><line x1="169.2" y1="233.4" x2="169.2" y2="237.4" stroke-width="1.5" class="dg-s-nba" stroke-dasharray="4 3"/><line x1="342" y1="126.2" x2="342" y2="154.2" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><line x1="342" y1="233.4" x2="342" y2="237.4" stroke-width="1" class="dg-s-ink3" stroke-dasharray="4 3"/><rect x="18" y="154.2" width="59.4" height="34" class="dg-f-ink3" rx="3" opacity="0.45"/><line x1="18" y1="154.2" x2="18" y2="188.2" stroke-width="2" class="dg-s-surface"/><text x="47.7" y="204.2" font-size="12" class="dg-f-ink2 dg-text" text-anchor="middle" font-weight="600">CLE 2 pts</text><rect x="77.4" y="154.2" width="86.4" height="34" class="dg-f-nba" rx="3" opacity="0.9"/><line x1="77.4" y1="154.2" x2="77.4" y2="188.2" stroke-width="2" class="dg-s-surface"/><text x="120.6" y="219.8" font-size="12" class="dg-f-nba dg-text" text-anchor="middle" font-weight="600">IND 2 pts</text><rect x="163.8" y="154.2" width="54" height="34" class="dg-f-ink3" rx="3" opacity="0.45"/><line x1="163.8" y1="154.2" x2="163.8" y2="188.2" stroke-width="2" class="dg-s-surface"/><text x="190.8" y="204.2" font-size="12" class="dg-f-ink2 dg-text" text-anchor="middle" font-weight="600">CLE turnover</text><rect x="217.8" y="154.2" width="124.2" height="34" class="dg-f-nba" rx="3" opacity="0.9"/><line x1="217.8" y1="154.2" x2="217.8" y2="188.2" stroke-width="2" class="dg-s-surface"/><text x="279.9" y="219.8" font-size="12" class="dg-f-nba dg-text" text-anchor="middle" font-weight="600">IND miss</text><line x1="18" y1="237.4" x2="342" y2="237.4" stroke-width="1" class="dg-s-rule"/><text x="12" y="263.4" font-size="13" class="dg-f-ink2 dg-text">IND had the ball at the decision mark and shot</text><text x="12" y="280.95" font-size="13" class="dg-f-ink2 dg-text">with 33 seconds left, so it got the ball back:</text><text x="12" y="298.5" font-size="13" class="dg-f-ink2 dg-text">two IND possessions to CLE&#x27;s one.</text><text x="12" y="342.5" font-size="17" class="dg-f-ink dg-display" font-weight="600">2. Sorting the team with the ball at