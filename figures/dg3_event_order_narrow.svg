<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 360 738.95" role="img" aria-label="How event order changed one period&#x27;s window points"><title>How event order changed one period&#x27;s window points</title><defs><marker id="dg-arrow-eca1240be8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="26" font-size="12" class="dg-f-ink2 dg-text">NYK at MIL, 2023-24, first quarter. Score shown</text><text x="12" y="42.2" font-size="12" class="dg-f-ink2 dg-text">MIL–NYK.</text><rect x="12" y="66.2" width="336" height="231.75" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="92.2" font-size="13" class="dg-f-ink dg-text" font-weight="700">Action-number order (published)</text><text x="24" y="120.2" font-size="12" class="dg-f-ink3 dg-text">#148</text><text x="66" y="120.2" font-size="12" class="dg-f-ink2 dg-text">0:19</text><text x="108" y="120.2" font-size="12" class="dg-f-ink dg-text">NYK makes a 3</text><text x="336" y="120.2" font-size="12" class="dg-f-ink dg-text" text-anchor="end">21–25</text><text x="28" y="142.95" font-size="13" class="dg-f-ink3 dg-text">…</text><text x="24" y="161.15" font-size="12" class="dg-f-ink3 dg-text">#152</text><text x="66" y="161.15" font-size="12" class="dg-f-ink2 dg-text">0:00</text><text x="108" y="161.15" font-size="12" class="dg-f-ink dg-text">end of period</text><text x="336" y="161.15" font-size="12" class="dg-f-ink dg-text" text-anchor="end">21–25</text><text x="24" y="183.9" font-size="12" class="dg-f-ink3 dg-text">#244</text><text x="66" y="183.9" font-size="12" class="dg-f-c8 dg-text" font-weight="700">5:05</text><text x="108" y="183.9" font-size="12" class="dg-f-ink dg-text">MIL misses</text><text x="336" y="183.9" font-size="12" class="dg-f-ink dg-text" text-anchor="end">21–25</text><rect x="18" y="191.65" width="324" height="22.75" class="dg-f-c8" rx="4" opacity="0.18"/><text x="24" y="206.65" font-size="12" class="dg-f-ink3 dg-text">#246</text><text x="66" y="206.65" font-size="12" class="dg-f-c8 dg-text" font-weight="700">5:04</text><text x="108" y="206.65" font-size="12" class="dg-f-ink dg-text">NYK rebound</text><text x="336" y="206.65" font-size="12" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">21–25</text><text x="24" y="235.4" font-size="12" class="dg-f-ink2 dg-text" font-style="italic">window opens and closes here</text><text x="24" y="265.4" font-size="13" class="dg-f-ink dg-text">NYK points in the final minute:</text><text x="336" y="265.4" font-size="19" class="dg-f-c8 dg-text" text-anchor="end" font-weight="700">0</text><rect x="12" y="313.95" width="336" height="300" class="dg-f-surface2 dg-s-rule" rx="8" stroke-width="1.5"/><text x="24" y="339.95" font-size="13" class="dg-f-ink dg-text" font-weight="700">Game-clock order (corrected)</text><text x="24" y="367.95" font-size="12" class="dg-f-ink3 dg-text">#244</text><text x="66" y="367.95" font-size="12" class="dg-f-c8 dg-text" font-weight="700">5:05</text><text x="108" y="367.95" font-size="12" class="dg-f-ink dg-text">MIL misses</text><text x="336" y="367.95" font-size="12" class="dg-f-ink dg-text" text-anchor="end">16–15</text><text x="24" y="390.7" font-size="12" class="dg-f-ink3 dg-text">#246</text><text x="66" y="390.7" font-size="12" class="dg-f-c8 dg-text" font-weight="700">5:04</text><text x="108" y="390.7" font-size="12" class="dg-f-ink dg-text">NYK rebound</text><text x="336" y="390.7" font-size="12" class="dg-f-ink dg-text" text-anchor="end">16–15</text><text x="28" y="413.45" font-size="13" class="dg-f-ink3 dg-text">…</text><rect x="18" y="416.65" width="324" height="22.75" class="dg-f-c3" rx="4" opacity="0.18"/><text x="24" y="431.65" font-size="12" class="dg-f-ink3 dg-text">#140</text><text x="66" y="431.65" font-size="12" class="dg-f-ink2 dg-text">1:03</text><text x="108" y="431.65" font-size="12" class="dg-f-ink dg-text">MIL rebound</text><text x="336" y="431.65" font-size="12" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">21–22</text><text x="28" y="454.4" font-size="13" class="dg-f-ink3 dg-text">…</text><text x="24" y="472.6" font-size="12" class="dg-f-ink3 dg-text">#148</text><text x="66" y="472.6" font-size="12" class="dg-f-ink2 dg-text">0:19</text><text x="108" y="472.6" font-size="12" class="dg-f-ink dg-text">NYK makes a 3</text><text x="336" y="472.6" font-size="12" class="dg-f-ink dg-text" text-anchor="end">21–25</text><text x="28" y="495.35" font-size="13" class="dg-f-ink3 dg-text">…</text><rect x="18" y="498.55" width="324" height="22.75" class="dg-f-c3" rx="4" opacity="0.18"/><text x="24" y="513.55" font-size="12" class="dg-f-ink3 dg-text">#152</text><text x="66" y="513.55" font-size="12" class="dg-f-ink2 dg-text">0:00</text><text x="108" y="513.55" font-size="12" class="dg-f-ink dg-text">end of period</text><text x="336" y="513.55" font-size="12" class="dg-f-ink dg-text" text-anchor="end" font-weight="700">21–25</text><text x="24" y="542.3" font-size="12" class="dg-f-ink2 dg-text" font-style="italic">shaded: where the window opens and closes</text><text x="24" y="572.3" font-size="13" class="dg-f-ink dg-text">NYK points in the final minute:</text><text x="336" y="572.3" font-size="19" class="dg-f-c3 dg-text" text-anchor="end" font-weight="700">3</text><text x="12" y="643.95" font-size="12" class="dg-f-ink2 dg-text">Two plays logged late, at 5:05 left, carried high</text><text x="12" y="660.15" font-size="12" class="dg-f-ink2 dg-text">action numbers, so in action order they came after</text><text x="12" y="676.35" font-size="12" class="dg-f-ink2 dg-text">the end of the period and took its score back to</text><text x="12" y="692.55" font-size="12" class="dg-f-ink2 dg-text">the start of the window. The same thing zeroed or</text><text x="12" y="708.75" font-size="12" class="dg-f-ink2 dg-text">shrank 1,089 of 7,221 team-periods in 2023-24</text><text x="12" y="724.95" font-size="12" class="dg-f-ink2 dg-text">(15%).</text></svg>
