<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 423.6" role="img" aria-label="From the own-points headline to the fair net comparison"><title>From the own-points headline to the fair net comparison</title><defs><marker id="dg-arrow-5f975c2840" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-f-ink3"/></marker></defs><text x="12" y="22" font-size="14" class="dg-f-ink2 dg-text">Points per team-period gained by shooting early, with 95% intervals</text><text x="12" y="48" font-size="15" class="dg-f-ink dg-text" font-weight="700">Own points, every team-period</text><text x="12" y="68.25" font-size="14" class="dg-f-ink2 dg-text">NBA 2023-24</text><line x1="628.28" y1="52" x2="710.519" y2="52" stroke-width="3" class="dg-s-nba"/><line x1="628.28" y1="45" x2="628.28" y2="59" stroke-width="2" class="dg-s-nba"/><line x1="710.519" y1="45" x2="710.519" y2="59" stroke-width="2" class="dg-s-nba"/><circle cx="669.333" cy="52" r="6" class="dg-f-nba"/><text x="669.333" y="39" font-size="14" class="dg-f-ink dg-text" text-anchor="middle">+0.78 [+0.68, +0.88]</text><text x="38" y="102" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">Keep only team-periods whose first</text><text x="38" y="120.9" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">shot came 20 to 45 seconds out, so</text><text x="38" y="139.8" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">both groups had the ball at similar</text><text x="38" y="158.7" font-size="14" class="dg-f-ink3 dg-text" font-style="italic">times</text><line x1="22" y1="88" x2="22" y2="168.7" stroke-width="1.5" class="dg-s-ink3 dg-arrowed" marker-end="url(#dg-arrow-5f975c2840)"/><text x="12" y="188.7" font-size="15" class="dg-f-ink dg-text" font-weight="700">Own points, comparable team-periods</text><text x="12" y="208.95" font-size="14" class="dg-f-ink2 dg-text">NBA 2023-24</text><line x1="492.975" y1="19